name: CI

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    branches:
      - develop
      - master
    types: [
      opened,
      synchronize,
      reopened
    ]

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'push'
    uses: indra-devops-latam/platform-ci-cd/.github/workflows/ci-nestjs.yml@develop

  publish_deploy_dev:
    if: github.event_name == 'pull_request' && github.base_ref == 'develop'
    permissions:
      contents: read
      id-token: write
    uses: indra-devops-latam/platform-ci-cd/.github/workflows/publish-deploy.yml@develop
    with:
      environment: dev
      aws_region: ${{ vars.AWS_REGION }}
      ecr_repository: ${{ vars.ECR_REPOSITORY_DEV }}
      eks_cluster: ${{ vars.EKS_CLUSTER_DEV }}
      namespace: auth-ms
      helm_release: auth-ms
      chart_path: ./k8s/auth-ms
      deploy: false
    secrets: inherit

  publish_deploy_prod:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    permissions:
      contents: read
      id-token: write
    uses: indra-devops-latam/platform-ci-cd/.github/workflows/publish-deploy.yml@develop
    with:
      environment: prod
      aws_region: ${{ vars.AWS_REGION }}
      ecr_repository: ${{ vars.ECR_REPOSITORY_PROD }}
      eks_cluster: ${{ vars.EKS_CLUSTER_PROD }}
      namespace: auth-ms
      helm_release: auth-ms
      chart_path: ./k8s/auth-ms
      deploy: false
    secrets: inherit
