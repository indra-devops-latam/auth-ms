name: Release

on:
  push:
    branches:
      - develop
      - master

permissions:
  contents: read
  id-token: write

jobs:
  deploy_dev:
    if: github.ref == 'refs/heads/develop'
    uses: indra-devops-latam/platform-ci-cd/.github/workflows/publish-deploy.yml@develop
    with:
      environment: dev
      aws_region: ${{ vars.AWS_REGION }}
      ecr_repository: ${{ vars.ECR_REPOSITORY_DEV }}
      eks_cluster: ${{ vars.EKS_CLUSTER_DEV }}
      namespace: auth-ms
      helm_release: auth-ms
      chart_path: ./k8s/auth-ms
      deploy: true
    secrets: inherit

  deploy_prod:
    if: github.ref == 'refs/heads/master'
    uses: indra-devops-latam/platform-ci-cd/.github/workflows/publish-deploy.yml@develop
    with:
      environment: prod
      aws_region: ${{ vars.AWS_REGION }}
      ecr_repository: ${{ vars.ECR_REPOSITORY_PROD }}
      eks_cluster: ${{ vars.EKS_CLUSTER_PROD }}
      namespace: auth-ms
      helm_release: auth-ms
      chart_path: ./k8s/auth-ms/Chart.yaml
      deploy: true
    secrets: inherit