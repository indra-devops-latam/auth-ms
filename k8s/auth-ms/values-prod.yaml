replicaCount: 2

env:
  - name: NODE_ENV
    value: "production"
  - name: PORT
    value: "3000"
  - name: NATS_SERVERS
    value: "nats://nats"
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: auth-secrets
        key: mongodb_url
  - name: JWT_SECRET
    valueFrom:
      secretKeyRef:
        name: auth-secrets
        key: jwt_secret

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi