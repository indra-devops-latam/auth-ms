apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Chart.Name }}
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy: {}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
      - image: {{ printf "%s:%s" (required "image.repository es obligatorio" .Values.image.repository) (required "image.tag es obligatorio" .Values.image.tag) | quote }}
        name: {{ .Chart.Name }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}

        env: {{- toYaml .Values.env | nindent 12 }}
        
        resources: {{- toYaml .Values.resources | nindent 12 }}

        readinessProbe:
          httpGet:
            path: {{ .Values.readinessProbe.httpGet.path }}
            port: {{ .Values.readinessProbe.httpGet.port }}
          initialDelaySeconds: {{ .Values.readinessProbe.httpGet.initialDelaySeconds }}
          periodSeconds: {{ .Values.readinessProbe.httpGet.periodSeconds }}

        livenessProbe:
          httpGet:
            path: {{ .Values.livenessProbe.httpGet.path }}
            port: {{ .Values.livenessProbe.httpGet.port }}
          initialDelaySeconds: {{ .Values.livenessProbe.httpGet.initialDelaySeconds }}
          periodSeconds: {{ .Values.livenessProbe.httpGet.periodSeconds }}
status: {}
